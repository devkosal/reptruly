exclude: "^docs/|/migrations/"
default_stages: [commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.3.1
    hooks:
      - id: pyupgrade
        args: [--py310-plus]

  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort

  - repo: https://github.com/PyCQA/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
        # TODO (devkosal): fix 401s i.e. import error
        args: ["--config=setup.cfg", "--ignore=W503,F401"]
        additional_dependencies: [flake8-isort]
  # Custom added post cookiecutter
  - repo: https://github.com/rtts/djhtml
    rev: 3.0.0
    hooks:
      - id: djhtml
      - id: djcss
        # Exclude bootstrap JavaScript files or anything which has a .min.
        # Note: | is used for the regex "or" pattern
        exclude: .*/bootstrap*|.*\.min\..*
      - id: djjs
        # Exclude bootstrap JavaScript files or anything which has a .min.
        exclude: .*/bootstrap*|.*\.min\..*

# sets up .pre-commit-ci.yaml to ensure pre-commit dependencies stay up to date
ci:
  autoupdate_schedule: weekly
  skip: []
  submodules: false
