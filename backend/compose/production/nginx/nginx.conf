# https://testdriven.io/blog/dockerizing-django-with-postgres-gunicorn-and-nginx/
server_names_hash_bucket_size 128;

upstream django {
    server django:5000;
}

server {
    listen 80 default_server;
    server_name _;
    return 403;
}

server {
    listen 80;
    server_name
        reptruly.com
        www.reptruly.com
        reptruly.us-east-1.elasticbeanstalk.com
        # regex which allows any internal in CIDR 172.16.0.0/12
        # commented out since EBS only uses 172.31.* so we can
        # use the wildcard below instead to allow EBS health checks.
        # ^172\.(1[6-9]|2\d|3[01])(\.([1-9]?\d|[12]\d\d)){2}$\
        # may also need to add something for 10.0.0.0/8 (relevant when NAT not used)
        172.31.*;

    # API and admin — proxy to django
    location /api/ {
        proxy_pass http://django;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /admin/ {
        proxy_pass http://django;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Health check
    location /health/ {
        proxy_pass http://django;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Frontend — serve static files, fallback to index.html for SPA routing
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
