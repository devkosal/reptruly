{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}reptruly{% endblock title %}</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        :root {
            --ink: #0b1220;
            --ink-2: #101a30;
            --surface: #ffffff;
            --surface-2: #f3f5fa;
            --border: #e6e9f2;
            --border-strong: #d5dae6;
            --accent: #4f46e5;
            --accent-strong: #4338ca;
            --accent-soft: #eef0fe;
        }
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            background: var(--surface-2);
            color: var(--ink);
            line-height: 1.6;
        }
        .site-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
        }
        .site-header a {
            font-weight: 700;
            font-size: 18px;
            color: var(--ink);
            text-decoration: none;
        }
        .site-header a span { color: var(--accent); }
        .page {
            max-width: 480px;
            margin: 48px auto;
            padding: 0 16px;
        }
        h1 { color: var(--ink); font-size: 26px; margin: 0 0 16px; }
        h3 { color: var(--ink); font-size: 18px; }
        a { color: var(--accent); }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 28px;
        }
        form div { margin-bottom: 14px; }
        label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 9px 12px;
            font-size: 15px;
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            background: var(--surface);
            color: var(--ink);
        }
        input:focus {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
            border-color: var(--accent);
        }
        .btn, button[type="submit"], input[type="submit"] {
            display: inline-block;
            padding: 9px 18px;
            font-size: 15px;
            font-weight: 600;
            border: 1px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            background: var(--accent);
            color: #fff;
        }
        .btn:hover, button[type="submit"]:hover, input[type="submit"]:hover {
            background: var(--accent-strong);
        }
        .btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--border-strong); }
        .btn-secondary:hover { background: var(--surface-2); }
        .btn-danger { background: #b91c1c; }
        .btn-danger:hover { background: #991b1b; }
        a.secondaryAction {
            display: inline-block;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .errorlist { color: #b91c1c; font-size: 14px; margin: 4px 0; padding-left: 0; list-style: none; }
        .helptext { color: #5b6478; font-size: 13px; display: block; margin-top: 4px; }
        .messages { list-style: none; padding: 0; }
        .messages li {
            background: var(--accent-soft);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <a href="/">rep<span>truly</span></a>
    </header>
    <main class="page">
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}<li>{{ message }}</li>{% endfor %}
            </ul>
        {% endif %}
        {% block content %}{% endblock content %}
    </main>
</body>
</html>
